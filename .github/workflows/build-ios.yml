name: Unity iOS build

on:
  push:
    branches: [main]
    paths:
      - 'unity_project/**'
      - 'ipa_server.js'
      - 'email_auth_store.js'
      - 'ipa_core/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build-ios.yml'
  pull_request:
    paths:
      - 'unity_project/**'
      - 'ipa_server.js'
      - 'email_auth_store.js'
      - 'ipa_core/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:
    inputs:
      use_prebuilt_xcode:
        description: 'Use an Xcode export stored in a GitHub Release (does not need a Unity CI license)'
        required: false
        type: boolean
        default: false
      xcode_export_tag:
        description: 'Release tag containing ios-xcode-export.zip'
        required: false
        type: string
        default: iosvn-xcode-bootstrap
      export_ipa:
        description: 'Build and package an unsigned IPA for testing'
        required: false
        type: boolean
        default: false
      export_signed_ipa:
        description: 'Sign and package a development IPA for registered iPhones'
        required: false
        type: boolean
        default: false
      publish_release:
        description: 'Attach the unsigned IPA to a GitHub Release'
        required: false
        type: boolean
        default: false
      publish_signed_release:
        description: 'Attach the signed IPA to a GitHub Release'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release tag; blank creates a tag with the IPA signing type and run number'
        required: false
        type: string
        default: ''
      publish_container:
        description: 'Publish the standalone IPA game server to GitHub Packages (GHCR)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  license-check:
    name: Check Unity license
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.license.outputs.configured }}
    steps:
      - id: license
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          USE_PREBUILT_XCODE: ${{ inputs.use_prebuilt_xcode }}
        run: |
          if [[ "${USE_PREBUILT_XCODE:-false}" == "true" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$UNITY_LICENSE" && -n "$UNITY_EMAIL" && -n "$UNITY_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Unity build skipped. Configure UNITY_LICENSE, UNITY_EMAIL, and UNITY_PASSWORD Actions secrets, or dispatch with use_prebuilt_xcode=true."
          fi

  macos-preflight:
    name: Verify GitHub macOS and Xcode
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - name: Show Xcode and simulator runtimes
        shell: bash
        run: |
          sw_vers -productVersion
          xcodebuild -version
          xcrun simctl list devices available | head -n 12

  build-ios:
    name: Build and validate on GitHub macOS
    needs: [license-check, macos-preflight]
    if: ${{ needs.license-check.outputs.configured == 'true' }}
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        if: ${{ inputs.use_prebuilt_xcode != true }}
        with:
          path: unity_project/Library
          key: unity-library-macos-${{ hashFiles('unity_project/ProjectSettings/ProjectVersion.txt', 'unity_project/Packages/manifest.json') }}
          restore-keys: unity-library-macos-

      - name: Download existing Unity Xcode export
        if: ${{ inputs.use_prebuilt_xcode == true }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          XCODE_EXPORT_TAG: ${{ inputs.xcode_export_tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xcode-export"
          gh release download "$XCODE_EXPORT_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern ios-xcode-export.zip \
            --dir "$RUNNER_TEMP/xcode-export"
          mkdir -p "$GITHUB_WORKSPACE/build/iOS"
          unzip -q "$RUNNER_TEMP/xcode-export/ios-xcode-export.zip" -d "$GITHUB_WORKSPACE/build/iOS"

      - uses: game-ci/unity-builder@v5.0.0
        if: ${{ inputs.use_prebuilt_xcode != true }}
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity_project
          targetPlatform: iOS
          unityVersion: auto
          buildsPath: build
          buildName: iOS
          buildMethod: IOSVN.TuTien.Editor.IOSBuild.Build
          customParameters: -iosBundleId ${{ vars.IOS_BUNDLE_ID || 'com.example.iosvn' }} -ipaServerUrl ${{ vars.IPA_SERVER_URL || '' }} -assetCdnUrl ${{ vars.ASSET_CDN_URL || '' }} -iosBuildPath ../build/iOS

      - name: Locate Xcode project
        shell: bash
        run: |
          PROJECT_PATH="$(find "$GITHUB_WORKSPACE/build/iOS" -maxdepth 3 -name Unity-iPhone.xcodeproj -print -quit)"
          if [[ -z "$PROJECT_PATH" ]]; then echo 'Unity-iPhone.xcodeproj was not found.' >&2; exit 1; fi
          echo "IOS_PROJECT_PATH=$PROJECT_PATH" >> "$GITHUB_ENV"

      - name: Compile for iOS device without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project "$IOS_PROJECT_PATH" -scheme Unity-iPhone \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-derived" \
            CODE_SIGN_IDENTITY='' CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Sign and export development IPA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.export_signed_ipa }}
        shell: bash
        env:
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          for name in IOS_BUNDLE_ID IOS_TEAM_ID IOS_CERTIFICATE_P12_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROFILE_BASE64; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Configure the GitHub Actions variable/secret $name before requesting a signed IPA."
              exit 1
            fi
          done

          PRODUCTS_PATH="$RUNNER_TEMP/ios-derived/Build/Products/Release-iphoneos"
          APP_PATH="$(find "$PRODUCTS_PATH" -mindepth 1 -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "Xcode did not produce an app under: $PRODUCTS_PATH" >&2
            exit 1
          fi
          APP_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          if [[ "$APP_BUNDLE_ID" != "$IOS_BUNDLE_ID" ]]; then
            echo "::error::Unity built bundle ID '$APP_BUNDLE_ID', but IOS_BUNDLE_ID is '$IOS_BUNDLE_ID'."
            exit 1
          fi

          SIGNING_DIR="$RUNNER_TEMP/ios-signing"
          KEYCHAIN_PATH="$SIGNING_DIR/iosvn-signing.keychain-db"
          PROFILE_PATH="$SIGNING_DIR/development.mobileprovision"
          DECODED_PROFILE="$SIGNING_DIR/profile.plist"
          mkdir -p "$SIGNING_DIR"
          chmod 700 "$SIGNING_DIR"
          KEYCHAIN_PASSWORD="$(/usr/bin/openssl rand -base64 32)"
          cleanup() {
            security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
            rm -rf "$SIGNING_DIR"
          }
          trap cleanup EXIT

          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$SIGNING_DIR/certificate.p12"
          printf '%s' "$IOS_PROFILE_BASE64" | /usr/bin/base64 -D > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$SIGNING_DIR/certificate.p12" -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security cms -D -i "$PROFILE_PATH" > "$DECODED_PROFILE"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$DECODED_PROFILE")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$DECODED_PROFILE")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          ARCHIVE_PATH="$RUNNER_TEMP/iOSVN.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/ios-signed-export"
          EXPORT_OPTIONS="$SIGNING_DIR/ExportOptions.plist"
          cat > "$EXPORT_OPTIONS" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>development</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>PLACEHOLDER</string>
            <key>provisioningProfiles</key><dict></dict>
          </dict></plist>
          PLIST
          /usr/libexec/PlistBuddy -c "Set :teamID $IOS_TEAM_ID" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$IOS_BUNDLE_ID string $PROFILE_UUID" "$EXPORT_OPTIONS"

          xcodebuild -project "$IOS_PROJECT_PATH" -scheme Unity-iPhone \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$RUNNER_TEMP/ios-signed-derived" \
            CODE_SIGN_STYLE=Manual CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY='Apple Development' \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" archive
          xcodebuild -exportArchive -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS" -exportPath "$EXPORT_PATH"

          IPA_PATH="$(find "$EXPORT_PATH" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          if [[ -z "$IPA_PATH" ]]; then
            echo "Xcode did not export an IPA under: $EXPORT_PATH" >&2
            exit 1
          fi
          cp "$IPA_PATH" "$RUNNER_TEMP/iOSVN-signed.ipa"
          /usr/bin/unzip -tq "$RUNNER_TEMP/iOSVN-signed.ipa"
          mkdir -p "$SIGNING_DIR/verify"
          /usr/bin/unzip -q "$RUNNER_TEMP/iOSVN-signed.ipa" -d "$SIGNING_DIR/verify"
          SIGNED_APP="$(find "$SIGNING_DIR/verify/Payload" -mindepth 1 -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$SIGNED_APP" ]]; then
            echo 'The exported IPA does not contain an app in Payload/.' >&2
            exit 1
          fi
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$SIGNED_APP"

      - name: Package unsigned IPA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.export_ipa }}
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS_PATH="$RUNNER_TEMP/ios-derived/Build/Products/Release-iphoneos"
          APP_PATH="$(find "$PRODUCTS_PATH" -mindepth 1 -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "Xcode did not produce an app under: $PRODUCTS_PATH" >&2
            find "$RUNNER_TEMP/ios-derived/Build/Products" -maxdepth 5 -name '*.app' -print || true
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          mkdir -p "$RUNNER_TEMP/unsigned-ipa/Payload"
          APP_NAME="$(basename "$APP_PATH")"
          ditto "$APP_PATH" "$RUNNER_TEMP/unsigned-ipa/Payload/$APP_NAME"
          (cd "$RUNNER_TEMP/unsigned-ipa" && /usr/bin/zip -qry "$RUNNER_TEMP/iOSVN-unsigned.ipa" Payload)
          /usr/bin/unzip -tq "$RUNNER_TEMP/iOSVN-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.use_prebuilt_xcode }}
        with:
          name: unity-ios-xcode-project
          path: build/iOS
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.export_ipa }}
        with:
          name: iosvn-unsigned-ipa
          path: ${{ runner.temp }}/iOSVN-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.export_signed_ipa }}
        with:
          name: iosvn-signed-ipa
          path: ${{ runner.temp }}/iOSVN-signed.ipa
          if-no-files-found: error
          retention-days: 14

  publish-unsigned-ipa-release:
    name: Attach unsigned IPA to GitHub Release
    needs: [build-ios]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.export_ipa && inputs.publish_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: iosvn-unsigned-ipa
          path: release-assets

      - name: Create release and upload IPA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG_INPUT"
          if [[ -z "$TAG" ]]; then TAG="iosvn-unsigned-${GITHUB_RUN_NUMBER}"; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/iOSVN-unsigned.ipa --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release-assets/iOSVN-unsigned.ipa \
              --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "iOSVN unsigned IPA ${GITHUB_RUN_NUMBER}" \
              --notes "Unsigned iOS build for testing; installing on iPhone requires an Apple-signed build."
          fi

  publish-signed-ipa-release:
    name: Attach signed IPA to GitHub Release
    needs: [build-ios]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.export_signed_ipa && inputs.publish_signed_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: iosvn-signed-ipa
          path: release-assets

      - name: Create release and upload IPA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG_INPUT"
          if [[ -z "$TAG" ]]; then TAG="iosvn-signed-${GITHUB_RUN_NUMBER}"; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/iOSVN-signed.ipa --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release-assets/iOSVN-signed.ipa \
              --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "iOSVN signed IPA ${GITHUB_RUN_NUMBER}" \
              --notes "Development-signed iOS build. The registered device must be included in the provisioning profile."
          fi

  publish-ipa-server-package:
    name: Publish IPA server container to GitHub Packages
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_container }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/iosvnnews/iosvn-ipa-server
          tags: |
            type=raw,value=unsigned-test
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Standalone email-auth IPA game server

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
