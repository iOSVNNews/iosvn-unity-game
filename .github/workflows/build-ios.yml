name: Tu Tiên Giới iOS build

on:
  push:
    branches: [main]
    paths:
      - 'unity_project/**'
      - 'ipa_server.js'
      - 'ipa_routes.js'
      - 'email_auth_store.js'
      - 'gmail_mailer.js'
      - 'account_oauth.js'
      - 'package*.json'
      - 'tests/**'
      - 'ipa_core/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/scripts/**'
      - '.github/workflows/build-ios.yml'
  pull_request:
    paths:
      - 'unity_project/**'
      - 'ipa_server.js'
      - 'ipa_routes.js'
      - 'email_auth_store.js'
      - 'gmail_mailer.js'
      - 'account_oauth.js'
      - 'package*.json'
      - 'tests/**'
      - 'ipa_core/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/scripts/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:
    inputs:
      cache_xcode_export_only:
        description: 'Cache the source Xcode export without compiling an IPA'
        required: false
        type: boolean
        default: false
      use_prebuilt_xcode:
        description: 'Use a cached Unity Xcode export (does not need a Unity CI license)'
        required: false
        type: boolean
        default: true
      xcode_export_tag:
        description: 'Fallback release tag containing ios-xcode-export.zip'
        required: false
        type: string
        default: iosvn-xcode-bootstrap
      xcode_export_run_id:
        description: 'Actions run ID containing the cached Xcode export artifact'
        required: false
        type: string
        default: ''
      export_ipa:
        description: 'Build and package an unsigned IPA for testing'
        required: false
        type: boolean
        default: true
      export_signed_ipa:
        description: 'Sign and package a development IPA for registered iPhones'
        required: false
        type: boolean
        default: false
      publish_release:
        description: 'Attach the unsigned IPA to a GitHub Release'
        required: false
        type: boolean
        default: true
      publish_signed_release:
        description: 'Attach the signed IPA to a GitHub Release'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release tag; blank creates a tag with the IPA signing type and run number'
        required: false
        type: string
        default: ''
      publish_container:
        description: 'Publish the standalone IPA game server to GitHub Packages (GHCR)'
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  validate-server:
    name: Check account API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  license-check:
    name: Check Unity license
    if: ${{ inputs.cache_xcode_export_only != true }}
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.license.outputs.configured }}
    steps:
      - id: license
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          USE_PREBUILT_XCODE: ${{ inputs.use_prebuilt_xcode }}
        run: |
          if [[ "${USE_PREBUILT_XCODE:-true}" == "true" ]] || [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$UNITY_LICENSE" && -n "$UNITY_EMAIL" && -n "$UNITY_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Unity build skipped. Configure UNITY_LICENSE, UNITY_EMAIL, and UNITY_PASSWORD Actions secrets, or dispatch with use_prebuilt_xcode=true."
          fi

  macos-preflight:
    name: Verify GitHub macOS and Xcode
    if: ${{ inputs.cache_xcode_export_only != true }}
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - name: Show Xcode and simulator runtimes
        shell: bash
        run: |
          sw_vers -productVersion
          xcodebuild -version
          xcrun simctl list devices available | head -n 12

  cache-xcode-export:
    name: Cache Xcode export for future IPA builds
    if: ${{ inputs.cache_xcode_export_only == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Xcode export from source release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          XCODE_EXPORT_TAG: ${{ inputs.xcode_export_tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xcode-export"
          RELEASES_JSON="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          ASSET_ID="$(printf '%s\n' "$RELEASES_JSON" | jq -r --arg tag "$XCODE_EXPORT_TAG" \
            '.[] | select(.tag_name == $tag) | .assets[] | select(.name == "ios-xcode-export.zip") | .id' | head -n1)"
          if [[ -z "$ASSET_ID" ]]; then
            echo "Could not find ios-xcode-export.zip in release $XCODE_EXPORT_TAG." >&2
            exit 1
          fi
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
            > "$RUNNER_TEMP/xcode-export/ios-xcode-export.zip"
          unzip -tq "$RUNNER_TEMP/xcode-export/ios-xcode-export.zip"

      - name: Save Xcode export for IPA workflows
        uses: actions/upload-artifact@v4
        with:
          name: TuTienGioi-ios-xcode-export
          path: ${{ runner.temp }}/xcode-export/ios-xcode-export.zip
          if-no-files-found: error
          retention-days: 90

  build-ios:
    name: Build and validate on GitHub macOS
    needs: [license-check, macos-preflight]
    if: ${{ inputs.cache_xcode_export_only != true && needs.license-check.outputs.configured == 'true' }}
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        if: ${{ inputs.use_prebuilt_xcode != true && github.event_name != 'push' }}
        with:
          path: unity_project/Library
          key: unity-library-macos-${{ hashFiles('unity_project/ProjectSettings/ProjectVersion.txt', 'unity_project/Packages/manifest.json') }}
          restore-keys: unity-library-macos-

      - name: Download existing Unity Xcode export
        if: ${{ (inputs.use_prebuilt_xcode == true || github.event_name == 'push') && (inputs.xcode_export_run_id == '' || inputs.xcode_export_run_id == null) }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          XCODE_EXPORT_TAG: ${{ inputs.xcode_export_tag || 'iosvn-xcode-bootstrap' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xcode-export"
          RELEASES_JSON="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" 2>/dev/null || echo "[]")"
          ASSET_ID="$(printf '%s\n' "$RELEASES_JSON" | jq -r --arg tag "$XCODE_EXPORT_TAG" \
            '.[] | select(.tag_name == $tag) | .assets[] | select(.name == "ios-xcode-export.zip") | .id' | head -n1)"
          if [[ -n "$ASSET_ID" ]]; then
            echo "Downloading ios-xcode-export.zip from release $XCODE_EXPORT_TAG..."
            gh api -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
              > "$RUNNER_TEMP/xcode-export/ios-xcode-export.zip"
          else
            echo "Release $XCODE_EXPORT_TAG not found. Searching latest Actions artifact..."
            LATEST_RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=TuTienGioi-ios-xcode-export" --jq '.artifacts[0].workflow_run.id // empty')"
            if [[ -n "$LATEST_RUN_ID" ]]; then
              echo "Downloading TuTienGioi-ios-xcode-export from workflow run $LATEST_RUN_ID..."
              gh run download "$LATEST_RUN_ID" --name TuTienGioi-ios-xcode-export --dir "$RUNNER_TEMP/xcode-export"
            else
              echo "Could not find ios-xcode-export artifact or release." >&2
              exit 1
            fi
          fi

      - name: Download Unity Xcode export from Actions artifact
        if: ${{ (inputs.use_prebuilt_xcode == true || github.event_name == 'push') && inputs.xcode_export_run_id != '' && inputs.xcode_export_run_id != null }}
        uses: actions/download-artifact@v4
        with:
          name: TuTienGioi-ios-xcode-export
          run-id: ${{ inputs.xcode_export_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/xcode-export

      - name: Validate and extract Unity Xcode export
        if: ${{ inputs.use_prebuilt_xcode == true || github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/xcode-export/ios-xcode-export.zip"
          test -f "$ARCHIVE"
          unzip -tq "$ARCHIVE"
          mkdir -p "$GITHUB_WORKSPACE/build/iOS"
          unzip -q "$ARCHIVE" -d "$GITHUB_WORKSPACE/build/iOS"

      - name: Keep Xcode export available for future IPA builds
        if: ${{ inputs.use_prebuilt_xcode == true || github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: TuTienGioi-ios-xcode-export
          path: ${{ runner.temp }}/xcode-export/ios-xcode-export.zip
          if-no-files-found: error
          retention-days: 90

      - uses: game-ci/unity-builder@v5.0.0
        if: ${{ inputs.use_prebuilt_xcode != true && github.event_name != 'push' }}
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity_project
          targetPlatform: iOS
          unityVersion: auto
          buildsPath: build
          buildName: TuTienGioi
          buildMethod: IOSVN.TuTien.Editor.IOSBuild.Build
          customParameters: -iosBundleId ${{ vars.IOS_BUNDLE_ID || 'com.iosvn.tutiengioi' }} -ipaServerUrl ${{ vars.IPA_SERVER_URL || '' }} -assetCdnUrl ${{ vars.ASSET_CDN_URL || '' }} -iosBuildPath ../build/iOS

      - name: Locate Xcode project
        shell: bash
        run: |
          PROJECT_PATH="$(find "$GITHUB_WORKSPACE/build/iOS" -maxdepth 3 -name Unity-iPhone.xcodeproj -print -quit)"
          if [[ -z "$PROJECT_PATH" ]]; then echo 'Unity-iPhone.xcodeproj was not found.' >&2; exit 1; fi
          echo "IOS_PROJECT_PATH=$PROJECT_PATH" >> "$GITHUB_ENV"

      - name: Normalize Unity framework header imports
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/normalize_unity_ios_framework_imports.py "$IOS_PROJECT_PATH"

      - name: Set Tu Tiên Giới app target identity
        shell: bash
        env:
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.iosvn.tutiengioi' }}
        run: |
          set -euo pipefail
          python3 .github/scripts/configure_ios_app_target.py "$IOS_PROJECT_PATH" "$IOS_BUNDLE_ID"

      - name: Apply Tu Tiên Giới app icon to Xcode project
        shell: bash
        env:
          APP_ICON_SOURCE: ${{ github.workspace }}/unity_project/Assets/Resources/Brand/TuTienGioi_AppIcon.png
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          source = Path(os.environ["APP_ICON_SOURCE"])
          root = Path(os.environ["GITHUB_WORKSPACE"]) / "build" / "iOS"
          iconsets = list(root.rglob("AppIcon.appiconset"))
          if not source.is_file() or not iconsets:
              sys.exit("Tu Tiên Giới app icon or Xcode AppIcon.appiconset is missing.")

          generated = 0
          for iconset in iconsets:
              contents_path = iconset / "Contents.json"
              contents = json.loads(contents_path.read_text(encoding="utf-8"))
              for entry in contents.get("images", []):
                  filename = entry.get("filename")
                  if not filename:
                      continue
                  points = float(entry["size"].split("x")[0])
                  scale = int(entry.get("scale", "1x").removesuffix("x"))
                  pixels = round(points * scale)
                  destination = iconset / filename
                  subprocess.run(
                      ["/usr/bin/sips", "-s", "format", "png", "-z", str(pixels), str(pixels), str(source), "--out", str(destination)],
                      check=True,
                      stdout=subprocess.DEVNULL,
                  )
                  generated += 1
          if generated == 0:
              sys.exit("The Xcode AppIcon.appiconset has no generated icon slots.")
          print(f"Generated {generated} Tu Tiên Giới iOS app icon sizes.")
          PY

      - name: Compile for iOS device without signing
        shell: bash
        env:
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.iosvn.tutiengioi' }}
        run: |
          set -euo pipefail
          xcodebuild -project "$IOS_PROJECT_PATH" -scheme Unity-iPhone \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-derived" \
            CODE_SIGN_IDENTITY='' CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Sign and export development IPA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.export_signed_ipa }}
        shell: bash
        env:
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.iosvn.tutiengioi' }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          for name in IOS_BUNDLE_ID IOS_TEAM_ID IOS_CERTIFICATE_P12_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROFILE_BASE64; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Configure the GitHub Actions variable/secret $name before requesting a signed IPA."
              exit 1
            fi
          done

          PRODUCTS_PATH="$RUNNER_TEMP/ios-derived/Build/Products/Release-iphoneos"
          APP_PATH="$(find "$PRODUCTS_PATH" -mindepth 1 -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "Xcode did not produce an app under: $PRODUCTS_PATH" >&2
            exit 1
          fi
          APP_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          if [[ "$APP_BUNDLE_ID" != "$IOS_BUNDLE_ID" ]]; then
            echo "::error::Unity built bundle ID '$APP_BUNDLE_ID', but IOS_BUNDLE_ID is '$IOS_BUNDLE_ID'."
            exit 1
          fi

          SIGNING_DIR="$RUNNER_TEMP/ios-signing"
          KEYCHAIN_PATH="$SIGNING_DIR/iosvn-signing.keychain-db"
          PROFILE_PATH="$SIGNING_DIR/development.mobileprovision"
          DECODED_PROFILE="$SIGNING_DIR/profile.plist"
          mkdir -p "$SIGNING_DIR"
          chmod 700 "$SIGNING_DIR"
          KEYCHAIN_PASSWORD="$(/usr/bin/openssl rand -base64 32)"
          cleanup() {
            security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
            rm -rf "$SIGNING_DIR"
          }
          trap cleanup EXIT

          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$SIGNING_DIR/certificate.p12"
          printf '%s' "$IOS_PROFILE_BASE64" | /usr/bin/base64 -D > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$SIGNING_DIR/certificate.p12" -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security cms -D -i "$PROFILE_PATH" > "$DECODED_PROFILE"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$DECODED_PROFILE")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$DECODED_PROFILE")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          ARCHIVE_PATH="$RUNNER_TEMP/iOSVN.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/ios-signed-export"
          EXPORT_OPTIONS="$SIGNING_DIR/ExportOptions.plist"
          cat > "$EXPORT_OPTIONS" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>development</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>PLACEHOLDER</string>
            <key>provisioningProfiles</key><dict></dict>
          </dict></plist>
          PLIST
          /usr/libexec/PlistBuddy -c "Set :teamID $IOS_TEAM_ID" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$IOS_BUNDLE_ID string $PROFILE_UUID" "$EXPORT_OPTIONS"

          xcodebuild -project "$IOS_PROJECT_PATH" -scheme Unity-iPhone \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$RUNNER_TEMP/ios-signed-derived" \
            CODE_SIGN_STYLE=Manual CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY='Apple Development' \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" archive
          xcodebuild -exportArchive -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS" -exportPath "$EXPORT_PATH"

          IPA_PATH="$(find "$EXPORT_PATH" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          if [[ -z "$IPA_PATH" ]]; then
            echo "Xcode did not export an IPA under: $EXPORT_PATH" >&2
            exit 1
          fi
          cp "$IPA_PATH" "$RUNNER_TEMP/TuTienGioi-signed.ipa"
          /usr/bin/unzip -tq "$RUNNER_TEMP/TuTienGioi-signed.ipa"
          mkdir -p "$SIGNING_DIR/verify"
          /usr/bin/unzip -q "$RUNNER_TEMP/TuTienGioi-signed.ipa" -d "$SIGNING_DIR/verify"
          SIGNED_APP="$(find "$SIGNING_DIR/verify/Payload" -mindepth 1 -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$SIGNED_APP" ]]; then
            echo 'The exported IPA does not contain an app in Payload/.' >&2
            exit 1
          fi
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$SIGNED_APP"
          DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$SIGNED_APP/Info.plist")"
          if [[ "$DISPLAY_NAME" != "Tu Tiên Giới" ]]; then
            echo "::error::Signed app display name is '$DISPLAY_NAME', expected 'Tu Tiên Giới'."
            exit 1
          fi

      - name: Package unsigned IPA
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.export_ipa) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        shell: bash
        env:
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.iosvn.tutiengioi' }}
        run: |
          set -euo pipefail
          PRODUCTS_PATH="$RUNNER_TEMP/ios-derived/Build/Products/Release-iphoneos"
          APP_PATH="$(find "$PRODUCTS_PATH" -mindepth 1 -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "Xcode did not produce an app under: $PRODUCTS_PATH" >&2
            find "$RUNNER_TEMP/ios-derived/Build/Products" -maxdepth 5 -name '*.app' -print || true
            exit 1
          fi
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          if [[ "$BUNDLE_ID" != "$IOS_BUNDLE_ID" ]]; then
            echo "::error::Unsigned app bundle ID is '$BUNDLE_ID', expected '$IOS_BUNDLE_ID'."
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Tu Tiên Giới'" "$APP_PATH/Info.plist"
          else
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'Tu Tiên Giới'" "$APP_PATH/Info.plist"
          fi
          DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist")"
          if [[ "$DISPLAY_NAME" != "Tu Tiên Giới" ]]; then
            echo "::error::Unsigned app display name is '$DISPLAY_NAME', expected 'Tu Tiên Giới'."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/unsigned-ipa/Payload"
          APP_NAME="$(basename "$APP_PATH")"
          ditto "$APP_PATH" "$RUNNER_TEMP/unsigned-ipa/Payload/$APP_NAME"
          UNSIGNED_APP="$RUNNER_TEMP/unsigned-ipa/Payload/$APP_NAME"
          # Unity ships UnityRuntime.framework with its own signature even when
          # Xcode builds the outer app with CODE_SIGNING_ALLOWED=NO. Some
          # on-device signers reject this mixed-signature IPA, so leave every
          # nested bundle unsigned for the user's selected certificate to sign.
          find "$UNSIGNED_APP" -type d -name '_CodeSignature' -prune -exec rm -rf {} +
          find "$UNSIGNED_APP" -type f -name 'embedded.mobileprovision' -delete
          if find "$UNSIGNED_APP" \( -type d -name '_CodeSignature' -o -type f -name 'embedded.mobileprovision' \) -print -quit | grep -q .; then
            echo 'Unsigned IPA still contains an old code signature or provisioning profile.' >&2
            exit 1
          fi
          (cd "$RUNNER_TEMP/unsigned-ipa" && /usr/bin/zip -qry "$RUNNER_TEMP/TuTienGioi-unsigned.ipa" Payload)
          /usr/bin/unzip -tq "$RUNNER_TEMP/TuTienGioi-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.use_prebuilt_xcode && github.event_name != 'push' }}
        with:
          name: TuTienGioi-ios-xcode-project
          path: build/iOS
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.export_ipa) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        with:
          name: TuTienGioi-unsigned-ipa
          path: ${{ runner.temp }}/TuTienGioi-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.export_signed_ipa }}
        with:
          name: TuTienGioi-signed-ipa
          path: ${{ runner.temp }}/TuTienGioi-signed.ipa
          if-no-files-found: error
          retention-days: 14

  publish-unsigned-ipa-release:
    name: Attach unsigned IPA to GitHub Release
    needs: [build-ios]
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.export_ipa && inputs.publish_release) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TuTienGioi-unsigned-ipa
          path: release-assets

      - name: Create release and upload IPA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG_INPUT"
          if [[ -z "$TAG" ]]; then TAG="tutiengioi-unsigned-${GITHUB_RUN_NUMBER}"; fi
          RELEASE_TITLE="Tu Tiên Giới - IPA chưa ký ${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TITLE" \
              --notes "IPA kiểm thử của Tu Tiên Giới. Cần cài qua công cụ ký như ESign; IPA chưa ký không thể cài trực tiếp."
            gh release delete-asset "$TAG" iOSVN-unsigned.ipa --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
            gh release upload "$TAG" release-assets/TuTienGioi-unsigned.ipa --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release-assets/TuTienGioi-unsigned.ipa \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "IPA kiểm thử của Tu Tiên Giới. Cần cài qua công cụ ký như ESign; IPA chưa ký không thể cài trực tiếp."
          fi

      - name: Keep only the two newest unsigned test releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OLD_TAGS="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select((.tag_name | startswith("tutiengioi-")) or .tag_name == "iosvn-unsigned-test") | [.tag_name, .published_at] | @tsv' \
            | sort -k2,2r | tail -n +3 | cut -f1)"
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            echo "Removing superseded unsigned IPA release: $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done <<< "$OLD_TAGS"

  publish-signed-ipa-release:
    name: Attach signed IPA to GitHub Release
    needs: [build-ios]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.export_signed_ipa && inputs.publish_signed_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TuTienGioi-signed-ipa
          path: release-assets

      - name: Create release and upload IPA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG_INPUT"
          if [[ -z "$TAG" ]]; then TAG="tutiengioi-signed-${GITHUB_RUN_NUMBER}"; fi
          RELEASE_TITLE="Tu Tiên Giới - IPA đã ký ${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TITLE" \
              --notes "IPA ký phát triển của Tu Tiên Giới; provisioning profile phải có thiết bị đã đăng ký."
            gh release delete-asset "$TAG" iOSVN-signed.ipa --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
            gh release upload "$TAG" release-assets/TuTienGioi-signed.ipa --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release-assets/TuTienGioi-signed.ipa \
              --repo "$GITHUB_REPOSITORY" --prerelease \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "IPA ký phát triển của Tu Tiên Giới; provisioning profile phải có thiết bị đã đăng ký."
          fi

  publish-ipa-server-package:
    name: Publish IPA server container to GitHub Packages
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_container }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/iosvnnews/iosvn-ipa-server
          tags: |
            type=raw,value=unsigned-test
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Standalone email-auth IPA game server

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
