name: Prepare IPA for LCSign

on:
  workflow_dispatch:
    inputs:
      ipa_run_id:
        description: 'Actions run containing TuTienGioi-unsigned-ipa'
        required: true
        type: string
      release_tag:
        description: 'Existing release receiving the LCSign-ready IPA'
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  prepare:
    name: Add replaceable code signatures
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - name: Download unsigned IPA from the requested build
        uses: actions/download-artifact@v4
        with:
          name: TuTienGioi-unsigned-ipa
          run-id: ${{ inputs.ipa_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/input

      - name: Sign bundles ad hoc for on-device re-signing
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/input/TuTienGioi-unsigned.ipa"
          stage="$RUNNER_TEMP/lcsign-stage"
          output="$RUNNER_TEMP/TuTienGioi-LCSign-ready.ipa"
          test -f "$archive"
          mkdir -p "$stage"
          unzip -q "$archive" -d "$stage"
          app="$(find "$stage/Payload" -mindepth 1 -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          test "$(find "$stage/Payload" -mindepth 1 -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')" = 1
          while IFS= read -r -d '' binary; do
            /usr/bin/codesign --force --sign - --timestamp=none "$binary"
          done < <(find "$app" -depth -type f -name '*.dylib' -print0)
          while IFS= read -r -d '' bundle; do
            /usr/bin/codesign --force --sign - --timestamp=none "$bundle"
          done < <(find "$app" -depth -type d \( -name '*.framework' -o -name '*.appex' \) -print0)
          /usr/bin/codesign --force --sign - --timestamp=none "$app"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          /usr/bin/codesign -dv "$app" 2>&1 | grep 'Signature=adhoc'
          /usr/bin/otool -l "$app/$executable" | grep 'LC_CODE_SIGNATURE'
          (cd "$stage" && /usr/bin/zip -qry "$output" Payload)
          /usr/bin/unzip -tq "$output"

      - name: Save LCSign-ready IPA as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: TuTienGioi-LCSign-ready-ipa
          path: ${{ runner.temp }}/TuTienGioi-LCSign-ready.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Attach LCSign-ready IPA to the game release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/TuTienGioi-LCSign-ready.ipa" --repo "$GITHUB_REPOSITORY" --clobber
